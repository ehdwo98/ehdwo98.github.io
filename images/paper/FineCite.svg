<svg xmlns="http://www.w3.org/2000/svg" width="400" height="300" viewBox="0 0 400 300">
  <rect width="400" height="300" fill="#f7f8fb" stroke="#d0d4dc" stroke-width="2"/>
  <!-- document text lines -->
  <rect x="50" y="60" width="300" height="12" rx="6" fill="#d5dae4"/>
  <rect x="50" y="90" width="300" height="12" rx="6" fill="#d5dae4"/>
  <!-- highlighted citation context -->
  <rect x="45" y="115" width="310" height="46" rx="8" fill="#fff3c4" stroke="#f0b428" stroke-width="2"/>
  <rect x="55" y="122" width="290" height="12" rx="6" fill="#e8cf8a"/>
  <rect x="55" y="142" width="180" height="12" rx="6" fill="#e8cf8a"/>
  <!-- citation marker -->
  <rect x="245" y="140" width="60" height="16" rx="4" fill="#1772d0"/>
  <text x="275" y="153" text-anchor="middle" font-family="Verdana, sans-serif" font-size="11" fill="#ffffff">[CITE]</text>
  <rect x="50" y="180" width="300" height="12" rx="6" fill="#d5dae4"/>
  <rect x="50" y="210" width="220" height="12" rx="6" fill="#d5dae4"/>
  <text x="200" y="265" text-anchor="middle" font-family="Verdana, sans-serif" font-size="18" font-weight="bold" fill="#4a5468">FineCite</text>
</svg>
